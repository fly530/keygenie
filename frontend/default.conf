server {
listen 80                  ;
listen [::]:80             ;
server_name localhost      ;
# 這是你的網站根目錄，建議放在這裡
root /usr/share/nginx/html ;

location / {
# 這樣寫更簡潔也更通用
try_files $uri $uri/ /index.html     ;
}
error_page 500 502 503 504 /50x.html ;
location = /50x.html {
root /usr/share/nginx/html           ;
}
}
