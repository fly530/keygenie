# Service：在叢集內部給這群 Pod 一個固定的存取入口（ClusterIP）
# Pod 會一直被建立/銷毀、IP 會變，Service 負責把流量穩定導到目前活著的 Pod 上
apiVersion: v1
kind: Service
metadata:
  name: keygenie-frontend
  namespace: keygenie
spec:
  # 靠這組 label 找到要轉發的 Pod（要跟 Deployment 的 Pod label 一致）
  selector:
    app: keygenie-frontend
  ports:
    # port：Service 自己對外開的 port
    # targetPort：實際轉發到 Pod 裡容器的哪個 port
    - port: 80
      targetPort: 80
